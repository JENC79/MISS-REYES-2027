<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miss Reyes 2027 - Votación Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'cinzel': ['Cinzel', 'serif'],
            'sans': ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans selection:bg-yellow-400 selection:text-slate-950">

  <!-- Encabezado / Banner -->
  <header class="border-b border-yellow-500/20 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-crown text-yellow-400 text-2xl"></i>
        <span class="font-cinzel text-xl font-bold tracking-wider text-yellow-400">MISS REYES 2027</span>
      </div>
      <span class="text-xs font-semibold px-3 py-1 rounded-full bg-yellow-500/10 border border-yellow-400/30 text-yellow-300 uppercase tracking-widest">
        Elección Oficial
      </span>
    </div>
  </header>

  <!-- Sección Principal -->
  <section class="max-w-4xl mx-auto px-4 pt-8 pb-4 text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-yellow-500/10 border border-yellow-400/30 mb-3">
      <i class="fa-solid fa-crown text-yellow-400 text-2xl"></i>
    </div>
    <h1 class="font-cinzel text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-yellow-400 to-amber-600 mb-2">
      VOTACIÓN OFICIAL DEL PÚBLICO
    </h1>
    <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
      Reyes, Beni - Bolivia • Apoya y elige a tu candidata preferida en tiempo real.
    </p>
  </section>

  <!-- Contenedor Dinámico de Candidatas -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="loading-spinner" class="text-center py-16">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-yellow-400 border-t-transparent mb-3"></div>
      <p class="text-slate-400 text-sm">Cargando candidatas desde Google Sheets...</p>
    </div>

    <div id="candidates-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
      <!-- Se carga dinámicamente -->
    </div>
  </main>

  <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
    <p>Comité Organizador Miss Reyes 2027 • Votación auditada vía Google Sheets</p>
  </footer>

  <!-- Lógica JavaScript -->
  <script>
    // =========================================================================
    // PEGA AQUÍ TU URL DE LA APLICACIÓN WEB DE GOOGLE APPS SCRIPT (DEBE TERMINAR EN /exec)
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5ZGAnrP4YeiosYLeHLYumW8M_4Oa7eFPvEpbsJJPwqRtVto1aTCKSYry-J5_R7lyBbw/exec";

    async function loadCandidates() {
      const spinner = document.getElementById('loading-spinner');
      const container = document.getElementById('candidates-container');

      try {
        const res = await fetch(SCRIPT_URL);
        const candidates = await res.json();

        spinner.classList.add('hidden');
        container.classList.remove('hidden');

        if (!Array.isArray(candidates) || candidates.length === 0) {
          container.innerHTML = `<p class="col-span-2 text-center text-slate-400">No se encontraron candidatas en la base de datos.</p>`;
          return;
        }

        const totalVotos = candidates.reduce((acc, curr) => acc + (parseInt(curr.votos) || 0), 0);

        container.innerHTML = candidates.map(c => {
          const votos = parseInt(c.votos) || 0;
          const porcentaje = totalVotos > 0 ? ((votos / totalVotos) * 100).toFixed(1) : '0.0';
          const primerNombre = c.nombre ? c.nombre.split(' ')[0] : 'Candidata';

          return `
            <article class="bg-slate-900/90 border border-yellow-500/30 rounded-3xl overflow-hidden shadow-2xl flex flex-col justify-between transition-all hover:border-yellow-400/60">
              <div>
                <div class="relative aspect-[4/5] bg-slate-950 overflow-hidden">
                  <img src="${c.foto}" alt="${c.nombre}" onerror="this.src='https://placehold.co/600x750/1e293b/d4af37?text=Miss+Reyes+2027'" class="w-full h-full object-cover">
                  <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
                  <div class="absolute top-4 left-4 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded-full border border-yellow-400/40 text-yellow-300 font-cinzel text-xs font-bold">
                    #${c.numero || c.id}
                  </div>
                  <div class="absolute bottom-4 left-4 right-4">
                    <span class="text-[11px] font-semibold text-yellow-300 uppercase tracking-widest bg-yellow-500/20 px-2.5 py-0.5 rounded-full border border-yellow-400/30">
                      ${c.sector} • ${c.edad} años
                    </span>
                    <h2 class="font-cinzel text-2xl font-bold text-white mt-1">${c.nombre}</h2>
                  </div>
                </div>

                <div class="p-5">
                  <p class="text-xs text-slate-300 leading-relaxed italic mb-4">"${c.biografia}"</p>

                  <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 mb-4">
                    <div class="flex justify-between items-end mb-1">
                      <span class="text-xs text-slate-400 uppercase tracking-wider">Porcentaje</span>
                      <span class="text-2xl font-bold text-yellow-400 font-cinzel">${porcentaje}%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-2">
                      <div class="bg-gradient-to-r from-amber-500 to-yellow-300 h-full rounded-full transition-all duration-500" style="width: ${porcentaje}%"></div>
                    </div>
                    <div class="text-right text-xs text-slate-400">
                      <strong class="text-white">${votos.toLocaleString()}</strong> votos registrados
                    </div>
                  </div>
                </div>
              </div>

              <div class="px-5 pb-5">
                <button onclick="votar(${c.id}, '${c.nombre}')" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-yellow-500 via-yellow-400 to-amber-500 text-slate-950 font-bold text-sm uppercase tracking-wider shadow-lg hover:brightness-110 active:scale-[0.99] transition flex items-center justify-center gap-2">
                  <i class="fa-solid fa-crown"></i>
                  <span>Votar por ${primerNombre}</span>
                </button>
              </div>
            </article>
          `;
        }).join('');

      } catch (err) {
        console.error("Error al cargar candidatas:", err);
        spinner.classList.add('hidden');
        container.classList.remove('hidden');
        container.innerHTML = `<p class="col-span-2 text-center text-red-400 text-sm">No se pudieron cargar las candidatas. Verifica que la URL del script termine en /exec y sea pública.</p>`;
      }
    }

    async function votar(id, nombre) {
      const identificador = prompt(`Introduce tu correo o celular para validar tu voto único por ${nombre}:`);
      if (!identificador || !identificador.trim()) return;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ candidataId: id, identificador: identificador.trim() })
        });
        const data = await res.json();
        alert(data.message);
        if (data.status === "SUCCESS") {
          loadCandidates();
        }
      } catch (err) {
        console.error(err);
        alert("Error al enviar el voto. Inténtalo de nuevo.");
      }
    }

    window.addEventListener('DOMContentLoaded', loadCandidates);
  </script>
</body>
</html>
